services:
  backend:
    build:
      context: ./backend
    ports:
      - '8000:8000'
    environment:
      APP_ENVIRONMENT: production
    volumes:
      - backend_storage:/app/storage_data

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - '3000:80'
    depends_on:
      - backend

volumes:
  backend_storage:
